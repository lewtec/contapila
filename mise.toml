# Warning: Do not unify this file with others. Keep tool definitions localized.
[tools]
go = "1.27.0"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
run = "go mod tidy && go get -v ./..."

[tasks.codegen]
description = "Generate templ components and rebuild embedded web CSS"
run = "go generate ./..."

[tasks.format]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.test]
run = "go test ./..."

[tasks.ci]
description = "CI checks and tests"
depends = ["codegen", "test"]
wait_for = ["codegen"]

[tasks.release]
description = "Run a release"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
